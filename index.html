<script>
    let menu = document.getElementById('menu');
    if (menu) {
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }

        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var pageScroll = document.querySelector('.page-scroll');
            var target = document.querySelector(`[id='${decodeURIComponent(id)}']`);

            if (id === "top" && pageScroll) {
                pageScroll.scrollTo({
                    top: 0,
                    behavior: reduceMotion ? "auto" : "smooth"
                });
            } else if (target && !reduceMotion) {
                target.scrollIntoView({ behavior: "smooth" });
            } else if (target) {
                target.scrollIntoView();
            }

            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });
</script>
<script>
    var mybutton = document.getElementById("top-link");
    var pageScroll = document.querySelector('.page-scroll');
    var scrollTarget = pageScroll || window;
    var updateTopLink = function () {
        var scrollTop = pageScroll
            ? pageScroll.scrollTop
            : Math.max(document.body.scrollTop, document.documentElement.scrollTop);

        if (scrollTop > 800) {
            mybutton.style.visibility = "visible";
            mybutton.style.opacity = "1";
        } else {
            mybutton.style.visibility = "hidden";
            mybutton.style.opacity = "0";
        }
    };
    scrollTarget.addEventListener('scroll', updateTopLink, { passive: true });
    updateTopLink();
</script>
